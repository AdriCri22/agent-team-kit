name: Agentes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agentes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    # Windows está en la matriz a propósito: el CLI escribe por stdout y la codificación cambia
    # entre plataformas; ese fallo ya apareció una vez.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml>=6"

      - name: Validar documentos y permisos
        run: python agents/tools/validate.py

      - name: Tests de las herramientas
        run: python -m unittest discover -s tests -p "test_*.py" -v
